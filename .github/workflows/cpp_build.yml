name: C++ Engine Build

on:
  push:
    paths:
      - 'core/**'
      - 'CMakeLists.txt'

jobs:
  build-cpp:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install Pybind11 and CMake
      run: pip install pybind11 cmake
      
    - name: Compile Engine
      run: |
        mkdir build && cd build
        cmake ..
        make
        
    - name: Verify Module Load
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/build
        python -c "import fast_matcher; print('C++ Module loaded successfully.')"
